@if (isEdit) {
  <app-page-header
    title="Editar produto"
    [breadcrumb]="[{ label: 'Início', routerLink: '/' }, { label: 'Produtos', routerLink: '/produtos' }, { label: 'Editar' }]"
  />
} @else {
  <app-page-header
    title="Novo produto"
    [breadcrumb]="[{ label: 'Início', routerLink: '/' }, { label: 'Produtos', routerLink: '/produtos' }, { label: 'Novo' }]"
  />
}

<section class="page-content form-content">
  @if (loading) {
    <div class="form-loading">
      <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
    </div>
  } @else {
    <form nz-form [formGroup]="form" nzLayout="vertical" class="product-form">

      @if (!isEdit) {
        <nz-form-item>
          <nz-form-control>
            <label nz-checkbox [(ngModel)]="importFromExternal" [ngModelOptions]="{standalone: true}" (ngModelChange)="onImportFromExternalChange($event)">
              Importar da API externa (Fake Store)
            </label>
          </nz-form-control>
        </nz-form-item>

        @if (importFromExternal) {
          <nz-form-item>
            <nz-form-label nzRequired>Produto da API externa</nz-form-label>
            <nz-form-control nzErrorTip="Selecione um produto">
              <nz-select
                [(ngModel)]="selectedExternalId"
                [ngModelOptions]="{standalone: true}"
                nzPlaceHolder="Selecione um produto..."
                [nzLoading]="loadingExternal"
                nzShowSearch
                nzAllowClear
                nzSize="large"
              >
                @for (ext of externalProducts; track ext.id) {
                  <nz-option [nzValue]="ext.id" [nzLabel]="ext.title + ' — ' + (ext.price | currency:'BRL')"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        }

        @if (importFromExternal) {
          <nz-divider nzText="Opções adicionais" nzOrientation="left"></nz-divider>
        }
      }

      <div class="form-row">
        <nz-form-item class="form-row__item flex-2">
          <nz-form-label [nzRequired]="!importFromExternal || isEdit">Nome</nz-form-label>
          <nz-form-control nzErrorTip="Informe o nome do produto">
            <input
              nz-input
              formControlName="name"
              placeholder="Nome do produto"
              [appAutofocus]="!loading"
            />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="form-row__item flex-1">
          <nz-form-label [nzRequired]="!importFromExternal || isEdit">Preço (R$)</nz-form-label>
          <nz-form-control nzErrorTip="Informe um preço válido">
            <nz-input-number
              formControlName="price"
              [nzMin]="0"
              [nzStep]="1"
              [nzPrecision]="2"
              nzPlaceHolder="0,00"
              style="width: 100%"
            ></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label>Descrição</nz-form-label>
        <nz-form-control>
          <textarea
            nz-input
            formControlName="description"
            rows="3"
            placeholder="Descrição do produto (opcional)"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control>
          <label nz-checkbox formControlName="isActive">Produto ativo</label>
        </nz-form-control>
      </nz-form-item>

      <div class="form-actions">
        <button nz-button nzType="default" (click)="cancel()">Cancelar</button>
        <button nz-button nzType="primary" [nzLoading]="submitting" (click)="onSave()">Salvar</button>
      </div>
    </form>
  }
</section>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bp-api
  template:
    metadata:
      labels:
        app: bp-api
    spec:
      containers:
      - name: api
        image: bp-api:latest
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:80"
        livenessProbe:
          httpGet:
            path: /live
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bp-api
spec:
  selector:
    app: bp-api
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

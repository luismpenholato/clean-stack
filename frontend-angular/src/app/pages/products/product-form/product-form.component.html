@if (isEdit()) {
  <app-page-header
    title="Edit product"
    [breadcrumb]="[{ label: 'Home', routerLink: '/' }, { label: 'Products', routerLink: '/products' }, { label: 'Edit' }]"
  />
} @else {
  <app-page-header
    title="New product"
    [breadcrumb]="[{ label: 'Home', routerLink: '/' }, { label: 'Products', routerLink: '/products' }, { label: 'New' }]"
  />
}

<section class="page-content form-content">
  @if (loading()) {
    <div class="form-loading">
      <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
    </div>
  } @else {
    <form nz-form [formGroup]="form" nzLayout="vertical" class="product-form" (ngSubmit)="onSave()">

      @if (!isEdit()) {
        <nz-form-item>
          <nz-form-control>
            <label
              nz-checkbox
              [ngModel]="importFromExternal()"
              [ngModelOptions]="{standalone: true}"
              (ngModelChange)="onImportFromExternalChange($event)"
            >
              Import from external API (Fake Store)
            </label>
          </nz-form-control>
        </nz-form-item>

        @if (importFromExternal()) {
          <nz-form-item>
            <nz-form-label nzRequired>External API product</nz-form-label>
            <nz-form-control nzErrorTip="Select a product">
              <nz-select
                [ngModel]="selectedExternalId()"
                [ngModelOptions]="{standalone: true}"
                (ngModelChange)="selectedExternalId.set($event)"
                nzPlaceHolder="Select a product..."
                [nzLoading]="loadingExternal()"
                nzShowSearch
                nzAllowClear
                nzSize="large"
              >
                @for (ext of externalProducts(); track ext.id) {
                  <nz-option [nzValue]="ext.id" [nzLabel]="ext.title + ' — ' + (ext.price | currency:'USD')"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        }

        @if (importFromExternal()) {
          <nz-divider nzText="Additional options" nzOrientation="left"></nz-divider>
        }
      }

      <div class="form-row">
        <nz-form-item class="form-row__item flex-2">
          <nz-form-label [nzRequired]="!importFromExternal() || isEdit()">Name</nz-form-label>
          <nz-form-control nzErrorTip="Enter the product name">
            <input
              nz-input
              formControlName="name"
              placeholder="Product name"
              [appAutofocus]="!loading()"
            />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="form-row__item flex-1">
          <nz-form-label [nzRequired]="!importFromExternal() || isEdit()">Price ($)</nz-form-label>
          <nz-form-control nzErrorTip="Enter a valid price">
            <input
              nz-input
              type="text"
              placeholder="0.00"
              appCurrencyMask
              [appCurrencyMask]="currencyOptions"
              formControlName="price"
            />
          </nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label>Description</nz-form-label>
        <nz-form-control>
          <textarea
            nz-input
            formControlName="description"
            rows="3"
            placeholder="Product description (optional)"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control>
          <label nz-checkbox formControlName="isActive">Active product</label>
        </nz-form-control>
      </nz-form-item>

      <div class="form-actions">
        <button type="button" nz-button nzType="default" (click)="cancel()">Cancel</button>
        <button type="submit" nz-button nzType="primary" [nzLoading]="submitting()">Save</button>
      </div>
    </form>
  }
</section>

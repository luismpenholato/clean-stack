name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend-dotnet.sln

      - name: Build
        run: dotnet build backend-dotnet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend-dotnet.sln --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format backend-dotnet.sln --verify-no-changes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bp-frontend
  template:
    metadata:
      labels:
        app: bp-frontend
    spec:
      containers:
      - name: frontend
        image: bp-frontend:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bp-frontend
spec:
  selector:
    app: bp-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
